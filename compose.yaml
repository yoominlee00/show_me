services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: showme
      MYSQL_USER: showme
      MYSQL_PASSWORD: showme
      MYSQL_ROOT_PASSWORD: root-password
    ports:
      - "${MYSQL_PORT:-3307}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot-password"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DB_URL: jdbc:mysql://mysql:3306/showme?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      DB_USER: showme
      DB_PASSWORD: showme
      INGEST_API_TOKEN: ${INGEST_API_TOKEN:-local-dev-token}
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy

  simulator:
    build:
      context: .
      dockerfile: simulator/Dockerfile
    environment:
      INGEST_URL: http://backend:8080/api/v1/events
      INGEST_API_TOKEN: ${INGEST_API_TOKEN:-local-dev-token}
    command: ["-agents", "3", "-interval", "1s"]
    depends_on:
      - backend

volumes:
  mysql-data:
