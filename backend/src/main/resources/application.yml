spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/showme?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USER:showme}
    password: ${DB_PASSWORD:showme}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  ingest:
    api-token: ${INGEST_API_TOKEN:local-dev-token}
  retention:
    raw-events: 7d
    cleanup-cron: "0 15 3 * * *"

